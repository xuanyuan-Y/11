<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掼蛋游戏</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .input-group {
            margin: 15px 0;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .room-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .room-info p {
            margin: 5px 0;
            color: #333;
        }
        .hidden { display: none; }
        .player-list {
            margin: 15px 0;
        }
        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f8f9fa;
            margin: 5px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 掼蛋游戏</h1>
        
        <!-- 主菜单 -->
        <div id="mainMenu">
            <button class="btn btn-primary" onclick="startSinglePlayer()">单人模式（和电脑玩）</button>
            <button class="btn btn-secondary" onclick="showOnlineMenu()">在线对战（和朋友玩）</button>
        </div>

        <!-- 在线对战菜单 -->
        <div id="onlineMenu" class="hidden">
            <div class="input-group">
                <label>你的昵称</label>
                <input type="text" id="playerName" placeholder="输入你的昵称">
            </div>
            <button class="btn btn-primary" onclick="createRoom()">创建房间</button>
            <div style="margin: 20px 0; color: #999;">— 或 —</div>
            <div class="input-group">
                <label>房间号</label>
                <input type="text" id="roomIdInput" placeholder="输入6位房间号">
            </div>
            <div class="input-group">
                <label>房间密码</label>
                <input type="text" id="roomPasswordInput" placeholder="输入4位密码">
            </div>
            <button class="btn btn-secondary" onclick="joinRoom()">加入房间</button>
            <button class="btn" style="background: #eee;" onclick="showMainMenu()">返回</button>
        </div>

        <!-- 房间等待界面 -->
        <div id="roomWaiting" class="hidden">
            <h2>房间等待中</h2>
            <div class="room-info">
                <p>房间号：<strong id="displayRoomId"></strong></p>
                <p>房间密码：<strong id="displayPassword"></strong></p>
                <p style="color: #999; font-size: 12px;">把房间号和密码发给朋友，邀请他们加入</p>
            </div>
            <div class="player-list" id="playerList"></div>
            <button class="btn btn-secondary" onclick="addAI()">添加AI玩家</button>
            <button class="btn btn-primary" onclick="startGame()">开始游戏</button>
            <button class="btn" style="background: #eee;" onclick="leaveRoom()">离开房间</button>
        </div>

        <!-- 游戏界面（稍后填充） -->
        <div id="gameArea" class="hidden">
            <p>游戏界面加载中...</p>
        </div>
    </div>

    <script>
        let socket;
        let currentRoomId = null;
        let isHost = false;

        function showMainMenu() {
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('onlineMenu').classList.add('hidden');
            document.getElementById('roomWaiting').classList.add('hidden');
            document.getElementById('gameArea').classList.add('hidden');
        }

        function showOnlineMenu() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('onlineMenu').classList.remove('hidden');
        }

        function startSinglePlayer() {
            // 跳转到单机版游戏
            window.location.href = 'game.html?mode=single';
        }

        function initSocket() {
            socket = io();
            
            socket.on('playerJoined', (data) => {
                updatePlayerList(data.players);
            });

            socket.on('playerLeft', (data) => {
                updatePlayerList(data.players);
            });

            socket.on('gameStart', (data) => {
                // 跳转到游戏界面
                window.location.href = 'game.html?mode=online&room=' + currentRoomId;
            });
        }

        function createRoom() {
            const name = document.getElementById('playerName').value;
            if (!name) {
                alert('请输入昵称');
                return;
            }
            if (!socket) initSocket();
            
            socket.emit('createRoom', { playerName: name }, (response) => {
                if (response.success) {
                    currentRoomId = response.roomId;
                    isHost = true;
                    document.getElementById('displayRoomId').textContent = response.roomId;
                    document.getElementById('displayPassword').textContent = response.password;
                    document.getElementById('onlineMenu').classList.add('hidden');
                    document.getElementById('roomWaiting').classList.remove('hidden');
                    updatePlayerList([name]);
                } else {
                    alert(response.message);
                }
            });
        }

        function joinRoom() {
            const name = document.getElementById('playerName').value;
            const roomId = document.getElementById('roomIdInput').value;
            const password = document.getElementById('roomPasswordInput').value;
            if (!name || !roomId || !password) {
                alert('请填写完整信息');
                return;
            }
            if (!socket) initSocket();
            
            socket.emit('joinRoom', { roomId: roomId, password: password, playerName: name }, (response) => {
                if (response.success) {
                    currentRoomId = roomId;
                    isHost = false;
                    document.getElementById('onlineMenu').classList.add('hidden');
                    document.getElementById('roomWaiting').classList.remove('hidden');
                    alert('加入房间成功！等待房主开始游戏');
                } else {
                    alert(response.message);
                }
            });
        }

        function addAI() {
            socket.emit('addAI', {}, (response) => {
                if (!response.success) {
                    alert(response.message);
                }
            });
        }

        function startGame() {
            socket.emit('startGame', {}, (response) => {
                if (!response.success) {
                    alert(response.message);
                }
            });
        }

        function leaveRoom() {
            socket.disconnect();
            socket = null;
            currentRoomId = null;
            showMainMenu();
        }

        function updatePlayerList(players) {
            const listEl = document.getElementById('playerList');
            listEl.innerHTML = '';
            players.forEach((name, index) => {
                const div = document.createElement('div');
                div.className = 'player-item';
                div.innerHTML = `<span>座位${index + 1}</span><span>${name}</span>`;
                listEl.appendChild(div);
            });
        }
    </script>
</body>
</html>
