<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>港港掼蛋 v1.0</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: radial-gradient(ellipse at center, #1e7a45 0%, #0d4f2c 60%, #072d18 100%);
    color: #fff;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    position: relative;
}

/* 顶部栏 */
.top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 40px;
    background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 100%);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    z-index: 100;
    border-bottom: 1px solid rgba(255,215,0,0.3);
}
.top-bar .title {
    font-size: 15px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.top-bar .info {
    display: flex;
    gap: 10px;
    font-size: 12px;
}
.top-bar .info span {
    background: rgba(0,0,0,0.5);
    padding: 3px 10px;
    border-radius: 10px;
}
.restart-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
}

/* 玩家位置 */
.player {
    position: absolute;
    text-align: center;
}
.player .avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    margin: 0 auto;
}
.player .name {
    font-size: 12px;
    background: rgba(0,0,0,0.5);
    padding: 3px 8px;
    border-radius: 10px;
    margin-top: 5px;
}
.player .count {
    font-size: 11px;
    color: #ffd700;
    margin-top: 3px;
}
.player.top { top: 50px; left: 50%; transform: translateX(-50%); }
.player.left { left: 20px; top: 50%; transform: translateY(-50%); }
.player.right { right: 20px; top: 50%; transform: translateY(-50%); }
.player.bottom { bottom: 180px; left: 50%; transform: translateX(-50%); }

/* 出牌区域 */
.play-area {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 250px;
    min-height: 80px;
}
.play-cards {
    display: flex;
    justify-content: center;
    gap: 3px;
    min-height: 60px;
}
.play-info {
    font-size: 14px;
    margin-top: 10px;
    color: #ffd700;
}

/* 手牌区域 */
.hand-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 160px;
    background: rgba(0,0,0,0.3);
    padding: 10px;
}
.hand-cards {
    display: flex;
    justify-content: center;
    height: 100px;
    padding: 0 20px;
}

/* 单张牌 */
.card {
    width: 50px;
    height: 75px;
    background: white;
    border-radius: 5px;
    margin-left: -15px;
    padding: 5px;
    color: #000;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}
.card:first-child { margin-left: 0; }
.card:hover { transform: translateY(-10px); }
.card.selected { transform: translateY(-20px); box-shadow: 0 5px 10px rgba(0,0,0,0.5); }

/* 操作按钮 */
.action-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
}
.action-btn {
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}
.action-btn.sort { background: #9c27b0; color: white; }
.action-btn.manual { background: #ff5722; color: white; }
.action-btn.group { background: #00bcd4; color: white; }
.action-btn.hint { background: #ff9800; color: white; }
.action-btn.pass { background: #757575; color: white; }
.action-btn.play { background: #4caf50; color: white; }

/* 手机横屏适配 */
@media (orientation: landscape) and (max-height: 900px) {
    .top-bar { height: 30px; padding: 0 10px; }
    .top-bar .title { font-size: 12px; }
    .top-bar .info { gap: 5px; font-size: 10px; }
    .restart-btn { padding: 3px 8px; font-size: 10px; }
    
    .player .avatar { width: 35px; height: 35px; font-size: 18px; }
    .player .name { font-size: 10px; padding: 2px 6px; }
    .player .count { font-size: 9px; }
    .player.top { top: 35px; }
    .player.bottom { bottom: 120px; }
    
    .play-area { width: 180px; min-height: 50px; }
    .play-cards { gap: 2px; min-height: 40px; }
    .play-info { font-size: 11px; margin-top: 5px; }
    
    .hand-area { height: 110px; padding: 5px; }
    .hand-cards { height: 75px; padding: 0 10px; }
    
    .card { width: 35px; height: 50px; margin-left: -10px; padding: 3px; font-size: 11px; }
    .card.selected { transform: translateY(-12px); }
    
    .action-bar { gap: 8px; margin-top: 5px; }
    .action-btn { padding: 5px 10px; font-size: 11px; }
}
</style>
</head>
<body>
    <div class="top-bar">
        <div class="title">🎴 港港掼蛋 v1.0</div>
        <div class="info">
            <span id="levelInfo">打2</span>
            <span id="scoreInfo">我方:0 对方:0</span>
            <span id="roundInfo">第1局</span>
        </div>
        <button class="restart-btn" onclick="restartGame()">🔄 重新开始</button>
    </div>

    <div class="player top">
        <div class="avatar">🤖</div>
        <div class="name">对家(队友)</div>
        <div class="count">27张</div>
    </div>

    <div class="player left">
        <div class="avatar">🤖</div>
        <div class="name">上家</div>
        <div class="count">27张</div>
    </div>

    <div class="player right">
        <div class="avatar">🤖</div>
        <div class="name">下家</div>
        <div class="count">27张</div>
    </div>

    <div class="player bottom">
        <div class="avatar">😊</div>
        <div class="name">你</div>
        <div class="count">27张</div>
    </div>

    <div class="play-area">
        <div class="play-cards" id="playCards"></div>
        <div class="play-info" id="playInfo">等待发牌...</div>
    </div>

    <div class="hand-area">
        <div class="hand-cards" id="handCards">
            <div class="card">♠A</div>
            <div class="card">♥K</div>
            <div class="card">♦Q</div>
            <div class="card">♣J</div>
            <div class="card">♠10</div>
            <div class="card">♥9</div>
            <div class="card">♦8</div>
            <div class="card">♣7</div>
            <div class="card">♠6</div>
            <div class="card">♥5</div>
            <div class="card">♦4</div>
            <div class="card">♣3</div>
        </div>
        <div class="action-bar">
            <button class="action-btn sort">✨ 一键理牌</button>
            <button class="action-btn manual">🔀 手动理牌</button>
            <button class="action-btn group">📦 组牌</button>
            <button class="action-btn hint">💡 提示</button>
            <button class="action-btn pass">不要</button>
            <button class="action-btn play">出牌</button>
        </div>
    </div>

    <script>
        // 简单的点击选牌功能
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => {
                card.classList.toggle('selected');
            });
        });
    </script>
</body>
</html>
