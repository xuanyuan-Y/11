<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>掼蛋游戏 - 手机版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #1a5c2e;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* 顶部栏 */
.top-bar {
    height: 40px;
    background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 100%);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 15px;
    color: #ffd700;
    font-weight: bold;
}

/* 中间游戏区域 */
.game-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* 对家区域 */
.opponent {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
}

/* 上家区域 */
.previous-player {
    position: absolute;
    top: 60px;
    left: 10px;
    text-align: center;
}

/* 下家区域 */
.next-player {
    position: absolute;
    top: 60px;
    right: 10px;
    text-align: center;
}

/* 玩家头像 */
.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #4caf50;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin: 0 auto;
}

/* 玩家名字 */
.name {
    font-size: 12px;
    color: #fff;
    margin-top: 5px;
    background: rgba(0,0,0,0.5);
    padding: 2px 8px;
    border-radius: 10px;
}

/* 出牌区域 */
.play-area {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

/* 我的手牌区域 */
.my-cards {
    height: 150px;
    background: rgba(0,0,0,0.3);
    padding: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
}

/* 单张牌 */
.card {
    width: 50px;
    height: 70px;
    background: white;
    border-radius: 5px;
    display: inline-block;
    margin-right: -20px;
    padding: 5px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
}

.card.selected {
    transform: translateY(-20px);
}

/* 操作按钮区域 */
.buttons {
    height: 60px;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 10px;
}

.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.btn-primary {
    background: #4caf50;
    color: white;
}

.btn-secondary {
    background: #ff9800;
    color: white;
}
</style>
</head>
<body>
    <div class="top-bar">
        <span>掼蛋游戏 - 手机版</span>
        <span>打2 | 我方:0 对方:0</span>
    </div>

    <div class="game-area">
        <div class="opponent">
            <div class="avatar">🤖</div>
            <div class="name">对家（队友）</div>
        </div>

        <div class="previous-player">
            <div class="avatar">🤖</div>
            <div class="name">上家</div>
        </div>

        <div class="next-player">
            <div class="avatar">🤖</div>
            <div class="name">下家</div>
        </div>

        <div class="play-area">
            <div>当前出牌：</div>
            <div style="margin-top: 10px;">等待出牌...</div>
        </div>
    </div>

    <div class="my-cards">
        <div class="card">♠A</div>
        <div class="card">♥K</div>
        <div class="card">♦Q</div>
        <div class="card">♣J</div>
        <div class="card">♠10</div>
        <div class="card">♥9</div>
        <div class="card">♦8</div>
        <div class="card">♣7</div>
        <div class="card">♠6</div>
        <div class="card">♥5</div>
        <div class="card">♦4</div>
        <div class="card">♣3</div>
    </div>

    <div class="buttons">
        <button class="btn btn-primary">出牌</button>
        <button class="btn btn-secondary">不要</button>
        <button class="btn">提示</button>
        <button class="btn">理牌</button>
    </div>
</body>
</html>
